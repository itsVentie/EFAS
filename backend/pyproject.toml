[project]
name = "backend"
version = "0.1.0"
description = "Enterprise Fraud & Audit Scanner - Backend Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "betterproto>=1.2.5",
    "celery>=5.6.3",
    "elasticsearch>=9.5.0",
    "grpclib>=0.4.9",
    "litestar>=2.24.0",
    "redis>=8.1.0",
    "taskiq>=0.12.6",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.83.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
